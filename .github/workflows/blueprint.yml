name: Blueprint
on:
  push:
    branches: [main, feat/nexus-project-blueprint]
  pull_request:
permissions:
  contents: read
jobs:
  contract-and-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/blueprint/requirements.txt
      - run: python -m unittest discover -s tests/blueprint -v
      - run: python tools/work_plan.py check
      - run: python tools/work_plan.py next
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/blueprint/requirements.txt playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/blueprint_browser_check.py --self-test --output /tmp/blueprint-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blueprint-screenshots
          path: /tmp/blueprint-screenshots
          retention-days: 14
